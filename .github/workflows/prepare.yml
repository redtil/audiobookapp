# Makes a book's audio on GitHub's machines (started from the app).
# Needs the repository secret LIBRARY_KEY: an access token for the private
# library repository (Contents: read and write).
name: Prepare
run-name: Prepare ${{ inputs.book }}
on:
  workflow_dispatch:
    inputs:
      book:
        description: Book id
        required: true
      voice:
        description: Voice
        default: af_heart
      library:
        description: Library repository (owner/name)
        required: true
      music:
        description: Also read the book's moods and compose its background music
        default: "yes"
concurrency:
  group: prepare-${{ inputs.book }}
  cancel-in-progress: true
env:
  LIBRARY_KEY: ${{ secrets.LIBRARY_KEY }}
  DATA_REPO: ${{ inputs.library }}
  BOOK: ${{ inputs.book }}
  VOICE: ${{ inputs.voice }}
  MUSIC: ${{ inputs.music }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
      count: ${{ steps.plan.outputs.count }}
      mixparts: ${{ steps.plan.outputs.mixparts }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev --ignore-scripts
      - id: plan
        run: node server/prepare.mjs plan

  work:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: kokoro-fp32-v1
      - run: node server/prepare.mjs work
        env:
          CHAPTERS: ${{ matrix.chapters }}
          PART: ${{ github.run_id }}-${{ matrix.part }}

  # Reads the mood of every chapter (alongside the voice work).
  moods:
    if: inputs.music == 'yes'
    runs-on: ubuntu-latest
    outputs:
      compose: ${{ steps.moods.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - id: moods
        run: node server/music.mjs moods

  # Composes two versions of each mood the book has, one machine each.
  compose:
    needs: moods
    if: needs.moods.outputs.compose != '[]' && needs.moods.outputs.compose != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.moods.outputs.compose) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node server/music.mjs compose
        env:
          MOOD: ${{ matrix.mood }}
          VARIANT: ${{ matrix.variant }}

  # Mixes the music into the narration, following the book's moods, once the
  # voice and the music are both made.
  mix:
    needs: [plan, work, moods, compose]
    if: ${{ !cancelled() && inputs.music == 'yes' && needs.plan.result == 'success' && needs.work.result != 'failure' && needs.moods.result == 'success' && needs.plan.outputs.mixparts != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.mixparts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - run: node server/prepare.mjs mix
        env:
          CHAPTERS: ${{ matrix.chapters }}
          PART: mix-${{ github.run_id }}-${{ matrix.part }}

  # After a failure (not a pause), removes what the run left half-made.
  clean:
    needs: [plan, work, moods, compose, mix]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - run: node server/prepare.mjs clean
        env:
          NARRATION: ${{ (needs.plan.result == 'failure' || needs.work.result == 'failure') && 'failure' || 'success' }}
